name: planner-tests
services:
  db-test:
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: planner_test
      POSTGRES_PASSWORD: planner_test_local
      POSTGRES_DB: planner_test
    ports:
      - "127.0.0.1:5435:5432"
    # Disposable data; never mount the personal database volume here.
    tmpfs:
      - /var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U planner_test -d planner_test"]
      interval: 2s
      timeout: 5s
      retries: 30
